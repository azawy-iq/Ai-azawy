name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Build Unsigned IPA
      run: |
        # التأكد من وجود ملف مشروع أولاً لتجنب الأخطاء
        if ls *.xcodeproj 1> /dev/null 2>&1; then
          xcodebuild -project *.xcodeproj -scheme ${{ github.event.repository.name }} -sdk iphoneos -configuration Release clean build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          mkdir -p Payload
          cp -r build/Release-iphoneos/*.app Payload/
          zip -r AppBuild.ipa Payload
        else
          echo "لا توجد ملفات مشروع Xcode في المستودع بعد."
          exit 1
        fi

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iOS-App-IPA
        path: AppBuild.ipa
